version: '3.8'

services:
  # Target Database with tight connection limits to reproduce pool exhaustion
  postgres-db:
    image: postgres:15-alpine
    container_name: memops-target-postgres
    environment:
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: sre_password
      POSTGRES_DB: orders_db
    command: postgres -c max_connections=20 -c shared_buffers=32MB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Cache
  redis-cache:
    image: redis:7-alpine
    container_name: memops-target-redis
    ports:
      - "6379:6379"

  # MemOps Agent & Mission Control
  memops-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memops-sre-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
    depends_on:
      postgres-db:
        condition: service_healthy
